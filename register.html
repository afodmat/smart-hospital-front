<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Hospital System - Register</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <a href="#" class="logo">
                <span class="logo-icon">🏥</span>
                SmartHospital
            </a>
            <h1>Create Account</h1>
            <p>Join the Smart Hospital network</p>
        </div>

        <!-- Alert -->
        <div id="register-alert" class="alert"></div>

        <!-- Register Form -->
        <form id="register-form">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input 
                        type="text" 
                        id="firstName" 
                        placeholder="Dr. Jane Doe" 
                        required 
                    />
                </div>
                <div id="firstName-error" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="lastName">last Name</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input 
                        type="text" 
                        id="lastName" 
                        placeholder="Dr. Jane Doe" 
                        required 
                    />
                </div>
                <div id="lastName-error" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="otherNames">Other Names</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input 
                        type="text" 
                        id="otherNames" 
                        placeholder="Dr. Jane Doe" 
                        
                    />
                </div>
                <div id="otherNames-error" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon">📧</span>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="you@example.com" 
                        required 
                    />
                </div>
                <div id="email-error" class="error-message"></div>
            </div>

            <!-- <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="input-wrapper">
                    <span class="input-icon">📱</span>
                    <input 
                        type="tel" 
                        id="phone" 
                        placeholder="+1234567890" 
                        required 
                    />
                </div>
                <div id="phone-error" class="error-message"></div>
            </div> -->

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Min 8 characters" 
                        required 
                    />
                    <button 
                        type="button" 
                        class="toggle-password" 
                        onclick="togglePassword('password')"
                    >
                        👁️
                    </button>
                </div>
                <div id="password-error" class="error-message"></div>
            </div>

            <!-- <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔐</span>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        placeholder="Re-enter your password" 
                        required 
                    />
                    <button 
                        type="button" 
                        class="toggle-password" 
                        onclick="togglePassword('confirmPassword')"
                    >
                        👁️
                    </button>
                </div>
                <div id="confirmPassword-error" class="error-message"></div>
            </div> -->

            <button type="submit" id="register-btn" class="btn btn-primary" data-original-text="Create Account">
                Create Account
            </button>
        </form>

        <!-- Links -->
        <div class="auth-links">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
